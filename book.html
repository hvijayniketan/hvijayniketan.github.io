<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Your Stay | Hotel Vijay, Rajgir</title>
<meta name="description" content="Check availability and book Non-AC, AC and Family rooms at Hotel Vijay, Rajgir. Live rates and offers. Pay at the hotel.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8903a;--gold-light:#d4aa5a;--gold-pale:#f5e9cf;--deep:#1a1208;--cream:#faf6ee;--brown:#3b2910;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--deep);color:var(--gold-pale);font-family:'Jost',system-ui,sans-serif;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 5%;border-bottom:1px solid rgba(184,144,58,.3)}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;color:var(--gold-light);text-decoration:none;line-height:1.1}
.logo small{display:block;font:500 .62rem 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#c8b08a}
.top nav a{color:var(--gold-pale);text-decoration:none;font-size:.85rem;margin-left:18px}
.top nav a:hover{color:var(--gold-light)}
main{max-width:920px;margin:0 auto;padding:40px 5% 56px}
h1{font:400 clamp(2rem,6vw,3.2rem)/1.1 'Cormorant Garamond',serif;margin:0 0 8px}
h1 em{color:var(--gold-light)}
.lead{margin:0 0 28px;color:#d9c9a5;max-width:60ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;font-size:.95rem}
.cta a{color:var(--gold-pale);border:1px solid rgba(184,144,58,.5);padding:11px 18px;border-radius:8px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.cta a:hover{border-color:var(--gold-light)}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="index.html">Hotel Vijay<small>Rajgir, Bihar</small></a>
  <nav><a href="index.html">Home</a><a href="packages.html">Packages</a><a href="tourist-places.html">Tourist Places</a></nav>
</header>
<main>
  <h1>Book Your <em>Stay</em></h1>
  <p class="lead">Choose your dates and guests. You will see live prices and offers for our Non-AC, AC and Family rooms. You pay at the hotel.</p>
  <div id="hv-booking"></div>
  <script src="booking-widget.js?v=4"
    data-api="https://hotelvijay-booking.vijayniketan5.workers.dev/api"
    data-whatsapp="919835620220"
    data-accent="var(--gold)"
    data-text="var(--gold-pale)"
    data-on="var(--deep)"
    data-dark="1"
    data-rooms='{"Non AC Room":{"title":"Non-AC Room","desc":"King bed, ceiling fan, LED TV, clean linen"},"AC Room":{"title":"AC Room","desc":"King bed, air conditioning, LED TV, free Wi-Fi"},"Family Room":{"title":"Family Room","desc":"2 beds, AC, LED TV, extra space, Wi-Fi"}}'></script>
  <noscript><p>Please turn on JavaScript to book online, or call +91 98356 20220.</p></noscript>
  <div class="cta"><a href="tel:+919835620220">Call to book: +91 98356 20220</a><a href="https://wa.me/919835620220?text=Hello%2C%20I%20would%20like%20to%20book%20a%20room." target="_blank" rel="noopener">Book on WhatsApp</a></div>
</main>
</body>
</html>
